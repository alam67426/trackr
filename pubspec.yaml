name: trackr
description: Trackr - a local-first Smart UPI Expense Tracker for Indian users.
publish_to: "none"
version: 1.6.23+37

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.0.2
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  telephony:
    path: third_party/telephony
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/trackr_launcher_logo.jpeg

flutter_launcher_icons:
  android: true
  image_path_android: assets/branding/trackr_launcher_logo.jpeg
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/trackr_launcher_logo.jpeg
